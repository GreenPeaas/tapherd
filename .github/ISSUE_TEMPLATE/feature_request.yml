name: Feature request
description: Suggest an improvement to the free connector.
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: checkboxes
    id: policy
    attributes:
      label: Acceptable use
      options:
        - label: This request fits the [acceptable use policy](https://github.com/GreenPeaas/tapherd/blob/main/docs/ACCEPTABLE_USE.md). TapHerd doesn't automate engagement, account creation, scraping, CAPTCHAs, or detection evasion.
          required: true
