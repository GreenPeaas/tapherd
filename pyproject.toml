[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tapherd"
version = "0.1.1"
description = "Your AI can now use Android apps: an MCP server and CLI that let Codex, Claude, or Cursor control your Android phones and emulators."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "android", "adb", "ai-agents", "automation", "codex", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
dependencies = [
    "adbutils>=2.12,<3",
    "mcp>=1.30,<2",
    "pillow>=11,<14",
    "pydantic>=2.10,<3",
    "pyyaml>=6.0.2,<7",
    "typer>=0.16,<1",
]

[project.urls]
Homepage = "https://github.com/GreenPeaas/tapherd"
Documentation = "https://github.com/GreenPeaas/tapherd#readme"
Issues = "https://github.com/GreenPeaas/tapherd/issues"
Changelog = "https://github.com/GreenPeaas/tapherd/blob/main/CHANGELOG.md"

[project.scripts]
tapherd = "tapherd.cli:app"

[tool.setuptools.package-data]
"tapherd.recipes" = ["bundled/*.yaml"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
